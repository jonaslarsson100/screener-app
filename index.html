:root {
  --bg: #EEF1F4; --surface: #FFFFFF; --sunk: #E3E8ED; --ink: #1B2430; --muted: #66717F;
  --line: #D5DCE3; --gain: #1F7A4D; --gain-bg: #E1F1E8; --loss: #B4372B; --loss-bg: #F8E3E0;
  --hot: #B57F00; --hot-bg: #FBF0D2; --focus: #2F5D9A; --rail: #CBD3DB;
  --radius-s: 6px; --radius-l: 14px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #12171D; --surface: #1A2129; --sunk: #232C36; --ink: #E6EBF0; --muted: #8B96A3;
    --line: #2C3641; --gain: #4CC38A; --gain-bg: #18342A; --loss: #F0715F; --loss-bg: #3A2220;
    --hot: #F2B53A; --hot-bg: #3A2F14; --focus: #7FA8E0; --rail: #3A4552;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font: 400 15px/1.45 "IBM Plex Sans", system-ui, sans-serif;
  font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased;
  padding-bottom: calc(76px + env(safe-area-inset-bottom));
}
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.wrap { max-width: 640px; margin: 0 auto; padding: 0 16px; }

/* Header */
header { position: sticky; top: 0; z-index: 5; background: var(--bg); padding-top: env(safe-area-inset-top); }
.bar { display: flex; align-items: center; gap: 8px; height: 56px; }
.bar h1 { font-size: 20px; font-weight: 600; margin: 0; flex: 1; letter-spacing: -0.01em; }
.updated { color: var(--muted); font-size: 13px; }
.icon-btn { width: 40px; height: 40px; border-radius: 50%; border: 0; background: transparent; display: grid; place-items: center; cursor: pointer; color: var(--muted); }
.icon-btn:hover { background: var(--sunk); color: var(--ink); }
.icon-btn svg { width: 22px; height: 22px; }
.spin svg { animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Tabs */
nav.tabs { position: fixed; bottom: 0; left: 0; right: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
nav.tabs .wrap { display: grid; grid-template-columns: repeat(4, 1fr); }
nav.tabs button { border: 0; background: none; height: 60px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 12px; color: var(--muted); cursor: pointer; position: relative; }
nav.tabs button svg { width: 22px; height: 22px; }
nav.tabs button[aria-selected="true"] { color: var(--ink); font-weight: 500; }
nav.tabs .dot { position: absolute; top: 9px; left: calc(50% + 8px); min-width: 16px; height: 16px; border-radius: 8px; background: var(--hot); color: #fff; font-size: 10px; font-weight: 600; display: grid; place-items: center; padding: 0 4px; }

/* Summary */
.summary { padding: 8px 0 20px; }
.total { font-size: 34px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.1; }
.total small { font-size: 18px; font-weight: 500; color: var(--muted); margin-left: 4px; }
.figures { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px 12px; margin-top: 12px; }
.figures dt { color: var(--muted); font-size: 13px; }
.figures dd { margin: 0; font-weight: 500; }
.spark { margin-top: 14px; }
.spark svg { width: 100%; height: 56px; display: block; }
.spark p { margin: 2px 0 0; color: var(--muted); font-size: 12px; }

.gain { color: var(--gain); } .loss { color: var(--loss); }

h2 { font-size: 15px; font-weight: 600; margin: 24px 0 10px; display: flex; align-items: baseline; gap: 8px; }
h2 .count { color: var(--muted); font-weight: 400; }

/* Buttons */
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius-s); padding: 9px 14px; cursor: pointer; font-weight: 500; font-size: 14px; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn.primary:hover { opacity: .9; }
.btn.sell { color: var(--loss); }
.btn.wide { width: 100%; padding: 12px; font-size: 15px; }
.btn:disabled { opacity: .5; cursor: default; }
.link { border: 0; background: none; color: var(--focus); padding: 0; cursor: pointer; font-weight: 500; }

/* Position */
.pos { background: var(--surface); border-radius: var(--radius-l); padding: 14px 16px 12px; margin-bottom: 10px; }
.pos-top { display: flex; justify-content: space-between; gap: 12px; }
.pos-name { font-weight: 600; font-size: 16px; }
.strat { display: inline-block; font-size: 12px; font-weight: 500; padding: 1px 8px; border-radius: 10px; margin-left: 6px; vertical-align: 2px; white-space: nowrap; }
.strat-momentum { background: var(--hot-bg); color: var(--hot); }
.strat-pullback { background: var(--gain-bg); color: var(--gain); }
.strat-turtle { background: var(--sunk); color: var(--ink); }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius-s); padding: 3px; }
.seg button { border: 0; background: transparent; min-height: 38px; border-radius: 4px; cursor: pointer; font-weight: 500; font-size: 13px; color: var(--muted); padding: 4px; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 12px; }
.chip { border: 1px solid var(--line); background: transparent; border-radius: 16px; padding: 4px 12px; font-size: 13px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.src { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 10px; border: 1px solid var(--line); color: var(--muted); margin: 6px 6px 0 0; }
.src.idé { border-color: var(--focus); color: var(--focus); }
.src.analytiker { border-color: var(--gain); color: var(--gain); }
.found { font-size: 13px; margin-top: 6px; }
.found b { font-weight: 500; }
.warn { font-size: 13px; color: var(--loss); margin-top: 4px; }
.evrow { display: grid; grid-template-columns: 18px 1fr auto; gap: 8px; align-items: baseline; padding: 10px 16px; border-bottom: 1px solid var(--line); font-size: 14px; }
.evrow:last-child { border-bottom: 0; }
.evrow .arrow.up { color: var(--gain); } .evrow .arrow.down { color: var(--loss); } .evrow .arrow { color: var(--muted); }
.evrow a { color: var(--focus); text-decoration: none; font-size: 13px; }
.field textarea { width: 100%; min-height: 70px; border: 1px solid var(--line); border-radius: var(--radius-s); background: var(--bg); padding: 10px 12px; font-size: 16px; font-family: inherit; color: inherit; }
.cmp { width: 100%; border-collapse: collapse; font-size: 13px; background: var(--surface); border-radius: var(--radius-l); overflow: hidden; }
.cmp th, .cmp td { padding: 9px 10px; text-align: right; border-bottom: 1px solid var(--line); }
.cmp th:first-child, .cmp td:first-child { text-align: left; }
.cmp th { color: var(--muted); font-weight: 500; }
.cmp tr:last-child td { border-bottom: 0; }
.pos-sub { color: var(--muted); font-size: 13px; }
.pos-pl { text-align: right; }
.pos-pl b { display: block; font-size: 16px; font-weight: 600; }
.pos-actions { display: flex; gap: 8px; margin-top: 12px; }
.pos-actions .btn { flex: 1; padding: 7px 8px; }

/* Stop–target rail: the one bold element */
.rail { margin: 16px 0 4px; position: relative; height: 34px; }
.rail-track { position: absolute; top: 12px; left: 0; right: 0; height: 8px; border-radius: 4px;
  background: linear-gradient(90deg, var(--loss-bg), var(--sunk) 45%, var(--gain-bg)); }
.rail-fill { position: absolute; top: 12px; height: 8px; border-radius: 4px; }
.rail-gav { position: absolute; top: 8px; width: 2px; height: 16px; background: var(--muted); border-radius: 1px; }
.rail-now { position: absolute; top: 6px; width: 20px; height: 20px; margin-left: -10px; border-radius: 50%; background: var(--surface); border: 3px solid var(--ink); }
.rail-labels { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
.rail-labels span:last-child { text-align: right; }
.rail-labels b { color: var(--ink); font-weight: 500; }
.rail-note { font-size: 12px; color: var(--muted); margin-top: 2px; }
.rail.over .rail-now { border-color: var(--gain); }
.rail.under .rail-now { border-color: var(--loss); }

/* Lists */
.list { background: var(--surface); border-radius: var(--radius-l); overflow: hidden; }
.row { padding: 12px 16px; border-bottom: 1px solid var(--line); }
.row:last-child { border-bottom: 0; }
.row-head { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.row-title { font-weight: 600; }
.row-time { color: var(--muted); font-size: 13px; white-space: nowrap; }
.row-body { white-space: pre-line; color: var(--muted); font-size: 14px; margin-top: 4px; }
.row-actions { margin-top: 10px; display: flex; gap: 8px; }
.row.ev { border-left: 4px solid transparent; }
.ev-buy { border-left-color: var(--gain) !important; }
.ev-sell { border-left-color: var(--loss) !important; }
.ev-target { border-left-color: var(--focus) !important; }
.ev-hot_swing { border-left-color: var(--hot) !important; }
.day-head { color: var(--muted); font-size: 13px; margin: 20px 0 8px; }

/* Watch */
.watch-meta { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 10px; font-size: 13px; }
.watch-meta dt { color: var(--muted); }
.watch-meta dd { margin: 0; font-weight: 500; }
.dist { font-size: 13px; margin-top: 8px; }
.meter { height: 4px; border-radius: 2px; background: var(--sunk); margin-top: 6px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--hot); border-radius: 2px; }
.status { font-size: 12px; font-weight: 500; padding: 1px 7px; border-radius: 10px; background: var(--sunk); color: var(--muted); }
.status.triggered { background: var(--gain-bg); color: var(--gain); }

/* History */
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--line); border-radius: var(--radius-l); overflow: hidden; }
.stats div { background: var(--surface); padding: 12px; }
.stats dt { color: var(--muted); font-size: 12px; }
.stats dd { margin: 2px 0 0; font-weight: 600; font-size: 16px; }
details.report summary { cursor: pointer; padding: 12px 16px; list-style: none; display: flex; justify-content: space-between; }
details.report summary::-webkit-details-marker { display: none; }
details.report pre { white-space: pre-wrap; font: inherit; font-size: 14px; color: var(--muted); margin: 0; padding: 0 16px 14px; }
details.report { border-bottom: 1px solid var(--line); }
details.report:last-child { border-bottom: 0; }

/* Empty + notices */
.empty { text-align: center; padding: 36px 20px; color: var(--muted); }
.empty p { margin: 0 0 14px; }
.notice { background: var(--hot-bg); color: var(--ink); border-radius: var(--radius-s); padding: 12px 14px; font-size: 14px; margin: 8px 0 16px; }
.notice.err { background: var(--loss-bg); }

/* Sheet */
.scrim { position: fixed; inset: 0; background: rgba(10, 15, 20, .45); z-index: 20; display: none; align-items: flex-end; justify-content: center; }
.scrim.open { display: flex; }
.sheet { background: var(--surface); width: 100%; max-width: 640px; border-radius: 18px 18px 0 0; padding: 8px 16px calc(20px + env(safe-area-inset-bottom)); max-height: 92vh; overflow-y: auto; animation: rise .22s ease-out; }
@keyframes rise { from { transform: translateY(24px); opacity: .6; } }
@media (prefers-reduced-motion: reduce) { .sheet { animation: none; } .spin svg { animation: none; } }
.grab { width: 36px; height: 4px; border-radius: 2px; background: var(--line); margin: 4px auto 12px; }
.sheet h3 { margin: 0 0 4px; font-size: 18px; font-weight: 600; }
.sheet .lead { color: var(--muted); margin: 0 0 16px; font-size: 14px; }
.field { margin-bottom: 14px; }
.field label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 5px; }
.field input, .field select { width: 100%; height: 46px; border: 1px solid var(--line); border-radius: var(--radius-s); background: var(--bg); padding: 0 12px; font-size: 16px; }
.field input:focus { border-color: var(--focus); outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 25%, transparent); }
.field .hint { font-size: 12px; color: var(--muted); margin-top: 4px; }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.cols > * { min-width: 0; }
.preview { background: var(--bg); border-radius: var(--radius-s); padding: 10px 12px; font-size: 14px; margin: 4px 0 16px; }
.preview div { display: flex; justify-content: space-between; }
.sheet-actions { display: flex; gap: 10px; }
.sheet-actions .btn { flex: 1; padding: 12px; }
.danger-zone { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); }

.toast { position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 20px; font-size: 14px; z-index: 30; display: none; max-width: calc(100% - 32px); }
.toast.show { display: block; }
.toast.err { background: var(--loss); color: #fff; }
[hidden] { display: none !important; }

/* Konsensus och aktievy */
.cons { background: var(--bg); border-radius: var(--radius-s); padding: 10px 12px; margin: 0 0 10px; }
.cons h4 { margin: 0 0 6px; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.cons .item { padding: 8px 0; border-top: 1px solid var(--line); font-size: 14px; }
.cons .item:first-of-type { border-top: 0; padding-top: 2px; }
.cons .src-line { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.cons .meta { color: var(--muted); font-size: 12px; }
.tag { display: inline-block; font-size: 11px; font-weight: 500; padding: 0 7px; border-radius: 9px; background: var(--sunk); color: var(--muted); margin-left: 4px; }
.tag.warn { background: var(--hot-bg); color: var(--hot); }
.tag.bad { background: var(--loss-bg); color: var(--loss); }
.obs-off { opacity: .55; }
.msgs { font-size: 13px; margin: 0 0 12px; }
.msgs.err { color: var(--loss); } .msgs.warn { color: var(--hot); }
.msgs ul { margin: 4px 0 0; padding-left: 18px; }
fieldset.grp { border: 0; padding: 0; margin: 4px 0 6px; }
fieldset.grp legend { font-size: 13px; font-weight: 600; margin-bottom: 8px; padding: 0; }
.cols3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
.cols3 > * { min-width: 0; }
</style>
</head>

<script>
"use strict";
/* =====================================================================
   Konfiguration (sparas bara i den här webbläsaren)
   ===================================================================== */
const CFG_KEY = "screener.cfg", TOKEN_SESSION_KEY = "screener.token";
const GITHUB_API = "https://api.github.com";
const stored = safeJSON(lsGet(CFG_KEY)) || {};
const cfg = { owner: stored.owner || "", repo: stored.repo || "", branch: stored.branch || "data", fee: stored.fee || 0,
  remember: stored.remember !== false, token: stored.token || ssGet(TOKEN_SESSION_KEY) || "",
  api: GITHUB_API };   // ett sparat api-värde används aldrig: token får bara skickas till GitHub
const qs = new URLSearchParams(location.search);
if (qs.get("api") && apiOverrideAllowed(qs.get("api"), location)) cfg.api = qs.get("api");   // bara lokala tester
if ("api" in stored) saveCfg();   // städa bort en tidigare sparad adress
function lsGet(k) { try { return localStorage.getItem(k); } catch { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch {} }
function ssGet(k) { try { return sessionStorage.getItem(k); } catch { return null; } }
function ssSet(k, v) { try { v ? sessionStorage.setItem(k, v) : sessionStorage.removeItem(k); } catch {} }
function safeJSON(s) { try { return JSON.parse(s); } catch { return null; } }
/* Token sparas i localStorage bara om "Kom ihåg på den här enheten" är valt, annars bara för
   den här fliken (sessionStorage). api sparas aldrig. */
function saveCfg() {
  const keep = { owner: cfg.owner, repo: cfg.repo, branch: cfg.branch, fee: cfg.fee, remember: cfg.remember };
  if (cfg.remember) { keep.token = cfg.token; ssSet(TOKEN_SESSION_KEY, ""); } else ssSet(TOKEN_SESSION_KEY, cfg.token);
  lsSet(CFG_KEY, JSON.stringify(keep));
}
function forgetToken() { cfg.token = ""; ssSet(TOKEN_SESSION_KEY, ""); saveCfg(); }

/* =====================================================================
   GitHub-lagring: JSON-filer i grenen "data"
   ===================================================================== */
const FILES = ["positions", "ideas", "research", "events", "watchlist", "prices", "levels", "history", "reports"];
const DEFAULTS = { positions: { open: [], closed: [] }, ideas: { ideas: [] },
  research: { events: [], stocks: {}, candidates: {} }, events: [], watchlist: { entries: [] },
  prices: { updated: null, fx: {}, quotes: {} }, levels: {}, history: [], reports: [],
  consensus: { schema: 1, observations: [] } };   // consensus läses först när en aktievy öppnas
let D = structuredClone(DEFAULTS);
let shas = {};
let loadError = null;

function b64decode(b64) {
  const bin = atob(b64.replace(/\n/g, ""));
  return new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0)));
}
function b64encode(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = "";
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}
async function gh(path, opts = {}) {
  if (cfg.api !== GITHUB_API && !apiOverrideAllowed(cfg.api, location)) throw new Error("Otillåten API-adress");
  const res = await fetch(`${cfg.api}/repos/${cfg.owner}/${cfg.repo}/contents/${path}`, {
    ...opts, cache: "no-store",
    headers: { "Authorization": `Bearer ${cfg.token}`, "Accept": "application/vnd.github+json",
               "X-GitHub-Api-Version": "2022-11-28", ...(opts.body ? { "Content-Type": "application/json" } : {}) },
  });
  return res;
}
async function getFile(name) {
  const res = await gh(`${name}.json?ref=${encodeURIComponent(cfg.branch)}&t=${Date.now()}`);
  if (res.status === 404) return { data: null, sha: null, missing: true };
  if (res.status === 401 || res.status === 403) throw new Error("Token saknar behörighet. Kontrollera inställningarna.");
  if (!res.ok) throw new Error(`GitHub svarade ${res.status} för ${name}.json`);
  const j = await res.json();
  return { data: JSON.parse(b64decode(j.content)), sha: j.sha };
}
async function putFile(name, data, sha, message) {
  const body = { message, branch: cfg.branch, content: b64encode(JSON.stringify(data, null, 1) + "\n") };
  if (sha) body.sha = sha;
  const res = await gh(`${name}.json`, { method: "PUT", body: JSON.stringify(body) });
  if (res.status === 409 || res.status === 422) return { conflict: true, status: res.status, text: await res.text() };
  if (!res.ok) throw new Error(`Kunde inte spara (${res.status}). ${(await res.text()).slice(0, 140)}`);
  const j = await res.json();
  return { sha: j.content.sha };
}
/* Läser senaste versionen, gör ändringen och sparar. Om boten eller en annan
   enhet hunnit spara emellan försöker den igen med den nya versionen. */
async function mutatePositions(fn, message) { return mutateFile("positions", fn, message); }
async function mutateFile(name, fn, message) {
  for (let attempt = 0; attempt < 4; attempt++) {
    const cur = await getFile(name);
    const data = cur.data || structuredClone(DEFAULTS[name]);
    fn(data);
    const r = await putFile(name, data, cur.sha, message);
    if (!r.conflict) { D[name] = data; shas[name] = r.sha; return; }
    if (/Branch .* not found|No commit found for the ref/i.test(r.text || ""))
      throw new Error("Datagrenen finns inte än. Kör workflowen en gång i GitHub (Actions → Run workflow).");
  }
  throw new Error("Kunde inte spara efter flera försök. Försök igen.");
}
async function loadAll() {
  if (!cfg.owner || !cfg.repo || !cfg.token) { loadError = "setup"; return; }
  const results = await Promise.all(FILES.map(f => getFile(f).catch(e => ({ error: e }))));
  const err = results.find(r => r.error);
  if (err) { loadError = err.error.message; return; }
  loadError = results.every(r => r.missing) ? "nobranch" : null;
  FILES.forEach((f, i) => { D[f] = results[i].data ?? structuredClone(DEFAULTS[f]); shas[f] = results[i].sha; });
}

/* =====================================================================
   Beräkningar – samma logik som portfolio.py
   ===================================================================== */
const STRATS = { momentum: "Momentum Breakout", pullback: "Pullback", turtle: "Turtle" };
const stratOf = x => STRATS[x && x.strategy] ? x.strategy : "momentum";
const badge = x => `<span class="strat strat-${stratOf(x)}">${STRATS[stratOf(x)]}</span>`;
const marketOf = t => t.toUpperCase().endsWith(".ST") ? "se" : "us";
const curOf = t => marketOf(t) === "se" ? "kr" : "$";
const short = t => t.replace(/\.ST$/i, "");
function stats(p) {
  const ev = [...(p.buys || []).map(f => ["buy", f]), ...(p.sells || []).map(f => ["sell", f])]
    .sort((a, b) => (a[1].time || "").localeCompare(b[1].time || ""));
  let qty = 0, cost = 0, realized = 0, invested = 0;
  for (const [k, f] of ev) {
    const q = +f.qty, pr = +f.price, fee = +(f.fee || 0);
    if (k === "buy") { qty += q; cost += q * pr + fee; invested += q * pr + fee; }
    else { const gav = qty ? cost / qty : 0, qq = Math.min(q, qty); realized += qq * (pr - gav) - fee; cost -= gav * qq; qty -= qq; }
  }
  return { qty, gav: qty ? cost / qty : 0, realized, invested };
}
const fx = () => (D.prices.fx && D.prices.fx.USDSEK) || 0;
const toSek = (v, t) => marketOf(t) === "us" ? v * fx() : v;
const quote = t => (D.prices.quotes || {})[t];
function tickerTips(t) {
  // Tickers med kurs som liknar den inskrivna: samma början eller ett tecken fel (CAMAX → CAMX, MCOV → MCOV-B).
  const base = x => x.replace(/\.ST$/, "");
  const dist = (a, b) => {
    const d = Array.from({ length: a.length + 1 }, (_, i) => [i, ...Array(b.length).fill(0)]);
    for (let j = 1; j <= b.length; j++) d[0][j] = j;
    for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++)
      d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    return d[a.length][b.length];
  };
  const b = base(t), b0 = b.split("-")[0];
  return Object.keys(D.prices.quotes || {}).filter(k => k !== t && (quote(k) || {}).price)
    .filter(k => { const kb = base(k), k0 = kb.split("-")[0]; return k0 === b0 || dist(k0, b0) <= 1 || dist(kb, b) <= 1; })
    .slice(0, 4);
}
function levelsFor(p) {
  const lv = D.levels[p.id] || {};
  return { stop: p.stop_override ?? lv.stop ?? null, target: p.target_override ?? lv.target ?? null,
           autoStop: lv.stop ?? null, autoTarget: lv.target ?? null };
}

/* =====================================================================
   Formatering
   ===================================================================== */
const nf = d => new Intl.NumberFormat("sv-SE", { minimumFractionDigits: d, maximumFractionDigits: d });
const fmt = (x, d = 2) => x == null || isNaN(x) ? "–" : nf(d).format(x);
const money = (x, cur = "kr", d = 0) => `${fmt(x, d)} ${cur}`;
const signed = (x, cur = "kr", d = 0) => (x > 0 ? "+" : "") + money(x, cur, d);
const pct = x => x == null || !isFinite(x) ? "–" : (x > 0 ? "+" : "") + fmt(x * 100, 1) + " %";
const cls = x => x > 0 ? "gain" : x < 0 ? "loss" : "";
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function when(iso) {
  if (!iso) return "";
  const d = new Date(iso), now = new Date();
  const t = d.toLocaleTimeString("sv-SE", { hour: "2-digit", minute: "2-digit" });
  if (d.toDateString() === now.toDateString()) return `idag ${t}`;
  const y = new Date(now); y.setDate(now.getDate() - 1);
  if (d.toDateString() === y.toDateString()) return `igår ${t}`;
  return d.toLocaleDateString("sv-SE", { day: "numeric", month: "short" }) + ` ${t}`;
}
const dayLabel = iso => { const w = when(iso); return w.startsWith("idag") ? "Idag" : w.startsWith("igår") ? "Igår" :
  new Date(iso).toLocaleDateString("sv-SE", { weekday: "long", day: "numeric", month: "long" }); };
function localNow() { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 16); }
const num = v => parseFloat(String(v).replace(/\s/g, "").replace(",", "."));

/* =====================================================================
   Konsensus – rena funktioner (testas i tests/test_consensus.mjs)
   Observationer läggs bara till, de skrivs aldrig över. En rättelse är en ny
   observation med "supersedes"; en felregistrering markeras med en ny post av
   typen "retraction". Analytiker- och användarkonsensus hålls alltid isär.
   ===================================================================== */
/* CONSENSUS-LOGIC-START */
const C_SOURCES = {
  avanza: { label: "Avanza", layer: "analyst", manual: true },
  borsdata_sp: { label: "Börsdata (S&P)", layer: "analyst", manual: true },
  other: { label: "Annan", layer: "analyst", manual: true },
  yahoo: { label: "Yahoo", layer: "analyst", manual: false },
  borsdata_users: { label: "Börsdata-användare", layer: "user", manual: false },
};
const C_CURRENCIES = ["SEK", "EUR", "USD", "NOK", "DKK"];
const C_STALE_DAYS = 30;
function apiOverrideAllowed(param, loc) {
  // ?api= får bara peka om anropen när sidan körs lokalt och målet också är lokalt (tester).
  const local = h => h === "localhost" || h === "127.0.0.1";
  try { return local(loc.hostname) && local(new URL(param).hostname); } catch { return false; }
}
function cNum(v) {
  // "" eller null → null (saknas). Ogiltig text → NaN (fel). Svenskt decimalkomma godtas.
  if (v == null) return null;
  const t = String(v).replace(/[\s ]/g, "").replace(",", ".");
  if (t === "") return null;
  return /^[-+]?\d+(\.\d+)?$/.test(t) ? parseFloat(t) : NaN;
}
const cIsDate = s => /^\d{4}-\d{2}-\d{2}$/.test(s || "") && !isNaN(Date.parse(s + "T00:00:00Z"));
function cActive(list, ticker) {
  const all = (list || []).filter(o => !ticker || o.ticker === ticker);
  const retracted = new Set(all.filter(o => o.kind === "retraction").map(o => o.retracts));
  const superseded = new Set(all.filter(o => o.kind !== "retraction" && o.supersedes).map(o => o.supersedes));
  return all.filter(o => o.kind !== "retraction" && !retracted.has(o.id) && !superseded.has(o.id));
}
function cStatus(o, list) {
  const all = list || [];
  if (all.some(x => x.kind === "retraction" && x.retracts === o.id)) return "retracted";
  if (all.some(x => x.kind !== "retraction" && x.supersedes === o.id)) return "superseded";
  return "active";
}
function cCheckAmend(list, targetId) {
  // En rättelse eller felmarkering får bara gälla en observation som finns och fortfarande är aktiv
  // i den färska filen. Annars kan två enheter rätta samma post och historiken förgrena sig.
  const o = (list || []).find(x => x.id === targetId && x.kind !== "retraction");
  if (!o) return "Observationen finns inte i filen. Öppna aktien igen.";
  const s = cStatus(o, list);
  if (s !== "active") return `Observationen är redan ${s === "retracted" ? "markerad som fel" : "rättad"}, troligen från en annan enhet. Öppna aktien igen och utgå från den aktuella.`;
  return null;
}
function cAppend(list, rec) {
  // Bara tillägg. Befintliga poster ändras aldrig.
  if (!rec || !rec.id) throw new Error("Posten saknar id.");
  if (list.some(x => x.id === rec.id)) throw new Error("En post med samma id finns redan.");
  const target = rec.kind === "retraction" ? rec.retracts : rec.supersedes;
  if (target) { const e = cCheckAmend(list, target); if (e) throw new Error(e); }
  list.push(rec);
  return list;
}
function cUnchangedPrefix(before, after) {
  // Spärr: allt som fanns före sparandet ska finnas kvar oförändrat och i samma ordning.
  return after.length >= before.length && JSON.stringify(after.slice(0, before.length)) === JSON.stringify(before);
}
function cLatestBySource(list, ticker) {
  const out = {};
  for (const o of cActive(list, ticker)) {
    const k = o.source, cur = out[k];
    if (!cur || (o.observed_at + o.recorded_at) > (cur.observed_at + cur.recorded_at)) out[k] = o;
  }
  return out;
}
function cIsStale(o, today, days = C_STALE_DAYS) {
  const d = Date.parse(today + "T00:00:00Z") - Date.parse(o.observed_at + "T00:00:00Z");
  return d > days * 864e5;
}
function cUpside(target, targetCur, price, priceCur) {
  if (target == null) return { value: null, why: "ingen riktkurs" };
  if (!(price > 0)) return { value: null, why: "kurs saknas" };
  if (targetCur !== priceCur) return { value: null, why: "annan valuta" };
  return { value: target / price - 1, why: "" };
}
function cHorizonText(h) {
  if (!h) return "";
  return h.type === "12m" ? "12 mån" : h.type === "fiscal_year" ? `räkenskapsår ${h.year}` : String(h.type);
}
/* Validerar formulärdata. Returnerar { obs, errors, warnings }. errors stoppar sparandet,
   warnings visas och måste bekräftas. Saknade värden blir null, aldrig 0. */
function cValidate(input, existing, ctx) {
  const errors = [], warnings = [];
  const src = C_SOURCES[input.source];
  if (!src || !src.manual) errors.push("Välj källa.");
  if (!cIsDate(input.observed_at)) errors.push("Ange observationsdatum.");
  else if (input.observed_at > ctx.today) errors.push("Observationsdatum kan inte vara i framtiden.");
  if (input.source_date) {
    if (!cIsDate(input.source_date)) errors.push("Källans datum är ogiltigt.");
    else if (input.source_date > ctx.today) errors.push("Källans datum kan inte vara i framtiden.");
  }
  let horizon = null;
  if (input.horizon_type === "12m") horizon = { type: "12m" };
  else if (input.horizon_type === "fiscal_year") {
    const y = cNum(input.horizon_year);
    if (!(Number.isInteger(y) && y >= 2000 && y <= 2100)) errors.push("Ange räkenskapsår för prognoshorisonten.");
    else horizon = { type: "fiscal_year", year: y };
  } else errors.push("Välj prognoshorisont.");

  const target = cNum(input.target_price);
  if (Number.isNaN(target)) errors.push("Riktkursen är inte ett tal.");
  else if (target != null && !(target > 0)) errors.push("Riktkursen måste vara större än noll.");
  const currency = input.currency || null;
  if (target != null && !C_CURRENCIES.includes(currency)) errors.push("Välj valuta för riktkursen.");

  const count = (v, label) => {
    const n = cNum(v);
    if (Number.isNaN(n)) { errors.push(`${label}: inte ett tal.`); return null; }
    if (n != null && (!Number.isInteger(n) || n < 0)) { errors.push(`${label}: måste vara ett heltal, minst 0.`); return null; }
    return n;
  };
  const ratings = { buy: count(input.buy, "Köp"), hold: count(input.hold, "Behåll"), sell: count(input.sell, "Sälj") };
  const analysts = count(input.analysts, "Antal analytiker");

  const fnum = (v, label, allowNeg) => {
    const n = cNum(v);
    if (Number.isNaN(n)) { errors.push(`${label}: inte ett tal.`); return null; }
    if (n != null && !allowNeg && n < 0) { errors.push(`${label}: kan inte vara negativ.`); return null; }
    return n;
  };
  const forecasts = {
    revenue_m: fnum(input.revenue_m, "Omsättning", false),
    eps: fnum(input.eps, "EPS", true),
    revenue_growth_pct: fnum(input.revenue_growth_pct, "Omsättningstillväxt", true),
    earnings_growth_pct: fnum(input.earnings_growth_pct, "Vinsttillväxt", true),
    year: null,
  };
  const anyForecast = ["revenue_m", "eps", "revenue_growth_pct", "earnings_growth_pct"].some(k => forecasts[k] != null);
  const fy = cNum(input.forecast_year);
  if (fy != null && !(Number.isInteger(fy) && fy >= 2000 && fy <= 2100)) errors.push("Prognosåret är ogiltigt.");
  else forecasts.year = fy;
  if (anyForecast && forecasts.year == null) errors.push("Ange prognosår för prognoserna.");

  const anyRating = ratings.buy != null || ratings.hold != null || ratings.sell != null;
  if (target == null && !anyRating && analysts == null && !anyForecast) errors.push("Ange minst en uppgift (riktkurs, rekommendationer eller prognos).");

  if (analysts != null && ratings.buy != null && ratings.hold != null && ratings.sell != null) {
    const sum = ratings.buy + ratings.hold + ratings.sell;
    if (sum !== analysts) warnings.push(`Köp + behåll + sälj = ${sum}, men antal analytiker är ${analysts}.`);
  }
  if (target != null && currency && ctx.priceCurrency && currency !== ctx.priceCurrency)
    warnings.push(`Riktkursen är i ${currency} men aktien handlas i ${ctx.priceCurrency}. Uppsida räknas inte.`);
  if (horizon) {
    const same = cActive(existing, input.ticker).filter(o => o.source === input.source && o.observed_at === input.observed_at
      && JSON.stringify(o.horizon) === JSON.stringify(horizon) && o.id !== input.supersedes);
    if (same.length) warnings.push("Det finns redan en observation från samma källa, dag och horisont. Använd Rätta om den förra var fel.");
  }
  const obs = {
    id: ctx.id, kind: "observation", ticker: input.ticker, borsdata_id: null,
    layer: "analyst", source: input.source, provider: (input.provider || "").trim() || null, method: "manual",
    recorded_at: ctx.now, observed_at: input.observed_at, source_date: input.source_date || null,
    horizon, target_price: target, currency: target != null ? currency : null,
    ratings, analysts, forecasts, comment: (input.comment || "").trim(),
    quality: warnings.length ? "warning" : "ok", warnings,
    ai_allowed: input.ai_allowed !== false, supersedes: input.supersedes || null, schema: 1,
  };
  return { obs, errors, warnings };
}
function cRetraction(target, ctx, reason) {
  return { id: ctx.id, kind: "retraction", ticker: target.ticker, retracts: target.id, recorded_at: ctx.now,
           reason: (reason || "").trim() || "Felregistrering", schema: 1 };
}

function portfolioView() {

function sparkline() {
  const h = (D.history || []).slice(-90);
  if (h.length < 2) return "";
  const ys = h.map(r => r.total_result_sek), min = Math.min(...ys, 0), max = Math.max(...ys, 0);
  const W = 600, H = 56, span = max - min || 1;
  const pts = ys.map((y, i) => `${(i / (ys.length - 1) * W).toFixed(1)},${(H - 4 - (y - min) / span * (H - 8)).toFixed(1)}`);
  const zero = (H - 4 - (0 - min) / span * (H - 8)).toFixed(1);
  const last = ys[ys.length - 1];
  return `<div class="spark"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-label="Totalt resultat över tid">
      <line x1="0" x2="${W}" y1="${zero}" y2="${zero}" stroke="var(--line)" stroke-dasharray="4 4" vector-effect="non-scaling-stroke"/>
      <polyline points="${pts.join(" ")}" fill="none" stroke="${last >= 0 ? "var(--gain)" : "var(--loss)"}" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>
    </svg><p>Totalt resultat, senaste ${h.length} handelsdagarna</p></div>`;
}
function positionCard(p) {

function rail(price, gav, stop, target, cur) {
  if (stop == null || target == null || target <= stop)
    return `<p class="rail-note">Stop och target räknas fram vid botens nästa körning.</p>`;
  const lo = stop, hi = target, span = hi - lo;
  const pos = x => Math.min(Math.max((x - lo) / span, 0), 1) * 100;
  const now = pos(price), g = pos(gav);
  const state = price >= target ? "over" : price <= stop ? "under" : "";
  const fill = price >= gav
    ? `left:${g}%;width:${now - g}%;background:var(--gain)`
    : `left:${now}%;width:${g - now}%;background:var(--loss)`;
  const note = state === "over" ? "Över target." : state === "under" ? "Under stop – säljsignal." :
    `${pct(target / price - 1)} till target, ${pct(stop / price - 1)} till stop`;
  return `<div class="rail ${state}" role="img" aria-label="Kurs ${fmt(price)} mellan stop ${fmt(stop)} och target ${fmt(target)}">
      <div class="rail-track"></div><div class="rail-fill" style="${fill}"></div>

    <div class="rail-labels"><span>Stop <b>${fmt(stop)}</b></span><span>Target <b>${fmt(target)}</b></span></div>
    <div class="rail-note">${note}</div>`;
}

      <div class="meter"><i style="width:${(progress * 100).toFixed(0)}%"></i></div>` : ""}
    <div class="row-actions" style="flex-wrap:wrap">${consActions(e.ticker)}</div>
  </div>`;
}

/* ---------- Historik ---------- */
function closedStats(list) {
  const res = list.map(p => { const s = stats(p); return { p, s, r: toSek(s.realized, p.ticker), ret: s.realized / s.invested }; });
  const wins = res.filter(x => x.r > 0), losses = res.filter(x => x.r <= 0);
  const sum = a => a.reduce((t, x) => t + x.r, 0);
  return { res, wins, losses, sum, total: sum(res),
    winRate: res.length ? wins.length / res.length : null,
    avgWin: wins.length ? sum(wins) / wins.length : null,
    avgLoss: losses.length ? sum(losses) / losses.length : null,
    pf: losses.length && sum(losses) ? sum(wins) / Math.abs(sum(losses)) : (wins.length ? Infinity : null),
    avgDays: res.length ? res.reduce((t, x) => t + (new Date(x.p.closed) - new Date(x.p.buys[0].time)) / 864e5, 0) / res.length : null };
}
function historyView() {
  const all = D.positions.closed || [];
  const list = all.filter(p => histFilter === "all" || stratOf(p) === histFilter);
  const st = closedStats(list);
  const pfTxt = x => x == null ? "–" : x === Infinity ? "∞" : fmt(x, 2);
  const statsHtml = `<dl class="stats">
    <div><dt>Realiserat</dt><dd class="${cls(st.total)}">${signed(st.total)}</dd></div>
    <div><dt>Avslutade</dt><dd>${st.res.length}</dd></div>
    <div><dt>Vinnare</dt><dd>${st.winRate != null ? fmt(st.winRate * 100, 0) + " %" : "–"}</dd></div>
    <div><dt>Snittvinst</dt><dd class="gain">${st.avgWin != null ? signed(st.avgWin) : "–"}</dd></div>
    <div><dt>Snittförlust</dt><dd class="loss">${st.avgLoss != null ? signed(st.avgLoss) : "–"}</dd></div>
    <div><dt>Profit factor</dt><dd>${pfTxt(st.pf)}</dd></div>
  </dl>
  <p class="rail-note" style="margin-top:8px">${st.avgDays != null ? `Snittinnehav ${fmt(st.avgDays, 1)} dagar. ` : ""}Profit factor är vinsterna delat med förlusterna; över 1 betyder att strategin tjänar pengar.</p>`;
  const per = Object.keys(STRATS).map(k => [k, closedStats(all.filter(p => stratOf(p) === k))]).filter(([, x]) => x.res.length);
  const cmp = per.length > 1 || (per.length === 1 && histFilter === "all" && all.length) ? `<h2>Per strategi</h2>
    <table class="cmp"><thead><tr><th>Strategi</th><th>Affärer</th><th>Vinnare</th><th>Profit factor</th><th>Resultat</th></tr></thead><tbody>
    ${per.map(([k, x]) => `<tr><td>${STRATS[k]}</td><td>${x.res.length}</td><td>${fmt(x.winRate * 100, 0)} %</td><td>${pfTxt(x.pf)}</td><td class="${cls(x.total)}">${signed(x.total)}</td></tr>`).join("")}
    </tbody></table>` : "";
  const srcKey = p => p.idea_source || SRC_NAMES[(p.sources || [])[0]] || "Utan grund";
  const bySrc = {};
  all.forEach(p => (bySrc[srcKey(p)] = bySrc[srcKey(p)] || []).push(p));
  const srcRows = Object.entries(bySrc).map(([k, list]) => [k, closedStats(list)]);
  const cmpSrc = srcRows.length > 1 || (srcRows.length === 1 && srcRows[0][0] !== "Utan grund") ? `<h2>Per idékälla</h2>
    <table class="cmp"><thead><tr><th>Källa</th><th>Affärer</th><th>Vinnare</th><th>Profit factor</th><th>Resultat</th></tr></thead><tbody>
    ${srcRows.map(([k, x]) => `<tr><td>${esc(k)}</td><td>${x.res.length}</td><td>${fmt(x.winRate * 100, 0)} %</td><td>${pfTxt(x.pf)}</td><td class="${cls(x.total)}">${signed(x.total)}</td></tr>`).join("")}
    </tbody></table>` : "";
  const chips = `<div class="chips" role="group" aria-label="Visa strategi">${[["all", "Alla"], ...Object.entries(STRATS)]
    .map(([k, l]) => `<button class="chip" data-filter="${k}" aria-pressed="${histFilter === k}">${l}</button>`).join("")}</div>`;
  const rows = st.res.sort((a, b) => (b.p.closed || "").localeCompare(a.p.closed || "")).map(({ p, s, ret }) => `
    <div class="row"><div class="row-head">
      <span class="row-title">${esc(p.name || short(p.ticker))}${badge(p)}</span>
      <span class="${cls(s.realized)}" style="font-weight:600">${signed(s.realized, curOf(p.ticker))}</span></div>
      <div class="row-head" style="margin-top:2px"><span class="row-time">${esc(when(p.buys[0].time))} – ${esc(when(p.closed))}</span>
      <span class="${cls(ret)}" style="font-size:13px">${pct(ret)}</span></div></div>`).join("");
  const reports = (D.reports || []).slice(0, 30).map(r => `<details class="report"><summary><span>${esc(dayLabel(r.date + "T18:00"))}</span><span class="row-time">${r.market === "us" ? "USA" : "Sverige"}</span></summary><pre>${esc(r.body)}</pre></details>`).join("");
  return `<div style="height:8px"></div>${chips}${statsHtml}${cmp}${cmpSrc}<h2>Affärer</h2>
    ${rows ? `<div class="list">${rows}</div>` : `<p class="empty">Inga avslutade affärer ${histFilter === "all" ? "än" : "med den strategin än"}. När du säljer hela innehavet hamnar det här.</p>`}
    ${reports ? `<h2>Dagsrapporter</h2><div class="list">${reports}</div>` : ""}`;
}

const scrim = document.getElementById("scrim"), sheet = document.getElementById("sheet");
function openSheet(html, onMount) {
  sheet.innerHTML = `<div class="grab"></div>${html}`;
  scrim.classList.add("open");
  onMount && onMount(sheet);
  const first = sheet.querySelector("input:not([type=hidden]), select, button.primary");
  first && setTimeout(() => { if (!sheet.contains(document.activeElement)) first.focus(); }, 60);
}
function closeSheet() { scrim.classList.remove("open"); sheet.innerHTML = ""; }
scrim.addEventListener("click", e => { if (e.target === scrim) closeSheet(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && scrim.classList.contains("open")) closeSheet(); });

const field = (id, label, value = "", attrs = "", hint = "") =>
  `<div class="field"><label for="${id}">${label}</label><input id="${id}" value="${esc(value)}" ${attrs}>${hint ? `<div class="hint">${hint}</div>` : ""}</div>`;
const numAttrs = `inputmode="decimal" autocomplete="off"`;

function buySheet({ ticker = "", name = "", price = "", atr = null, event = null, posId = null,
                    strategy = null, stop = null, target = null, qty = null, addEvent = null, source = null } = {}) {
  const pos = posId && D.positions.open.find(p => p.id === posId);
  const ev = event && D.events.find(e => e.id === event);
  if (pos) ({ ticker, name } = { ticker: pos.ticker, name: pos.name });
  if (ev) { strategy = strategy || ev.strategy; stop = stop ?? ev.stop; target = target ?? ev.target; qty = qty ?? ev.qty;
    source = source || (ev.sources || []).join(","); }
  let k = STRATS[strategy] ? strategy : "momentum";
  const q = ticker && quote(ticker);
  if (!price && q) price = q.price;
  const lead = ev ? `${STRATS[k]}: signal ${when(ev.time)} på ${fmt(ev.price)} ${curOf(ev.ticker)}. Stop ${fmt(ev.stop)}, target ${fmt(ev.target)}.`
    : pos ? (addEvent ? `Turtle-påfyllning i ${esc(pos.name)}. Stoppen flyttas upp vid nästa körning.` : `Lägg till fler aktier i ${esc(pos.name)}. GAV räknas om.`)
    : "Fyll i det du köpte i Avanza.";
  openSheet(`
    <h3>${pos ? (addEvent ? "Registrera påfyllning" : "Köp mer") : "Registrera köp"}</h3><p class="lead">${lead}</p>
    <form id="f">
      ${pos ? "" : `<div class="cols">

      <div class="field"><label>Strategi</label><div class="seg" id="strat">
        ${Object.entries(STRATS).map(([v, l]) => `<button type="button" data-k="${v}" aria-pressed="${k === v}">${l}</button>`).join("")}</div></div>`}
      <div class="cols">
        ${field("qty", "Antal", qty ? String(qty) : "", `${numAttrs} required placeholder="100"`, qty ? "Förslag från signalen" : "")}
        ${field("pr", "Kurs per aktie", price ? String(+(+price).toFixed(4)).replace(".", ",") : "", `${numAttrs} required`)}
      </div>
      <div class="cols">
        ${field("fee", "Courtage", cfg.fee ? String(cfg.fee).replace(".", ",") : "0", numAttrs)}
        ${field("tm", "Tid", localNow(), `type="datetime-local" required`)}
      </div>
      <div class="preview" id="pv"></div>
      <div class="sheet-actions"><button type="button" class="btn" data-close>Avbryt</button><button class="btn primary" id="save">Spara köp</button></div>
    </form>`, root => {
    if (ticker && !pos) root.querySelector("#mk").value = marketOf(ticker);
    root.querySelectorAll("#strat button").forEach(b => b.onclick = () => {
      k = b.dataset.k; root.querySelectorAll("#strat button").forEach(x => x.setAttribute("aria-pressed", x === b));
    });
    const pv = root.querySelector("#pv");
    const upd = () => {
      const qty = num(root.querySelector("#qty").value), pr = num(root.querySelector("#pr").value), fee = num(root.querySelector("#fee").value) || 0;
      const cur = pos ? curOf(pos.ticker) : (root.querySelector("#mk").value === "us" ? "$" : "kr");
      pv.innerHTML = qty > 0 && pr > 0 ? `<div><span>Totalt</span><b>${money(qty * pr + fee, cur, 2)}</b></div>` : `<div><span>Totalt</span><span>–</span></div>`;
    };
    root.querySelectorAll("input,select").forEach(i => i.addEventListener("input", upd)); upd();
    root.querySelector("#f").onsubmit = async e => {
      e.preventDefault();
      const qty = num(root.querySelector("#qty").value), pr = num(root.querySelector("#pr").value);

      cfg.fee = fee; saveCfg();
      const fill = { time, qty, price: pr, fee, ...(addEvent ? { signal_id: addEvent } : {}) };
      if (pos) {
        await save(d => d.open.find(p => p.id === pos.id).buys.push(fill), `Köp mer ${short(pos.ticker)}`, addEvent ? "Påfyllning registrerad" : "Köp registrerat");
        return;
      }
      const mk = root.querySelector("#mk").value;
      let t = root.querySelector("#tk").value.trim().toUpperCase();
      if (!t) return toast("Fyll i ticker.", true);
      t = mk === "se" ? (t.endsWith(".ST") ? t : t.replace(/\s+/g, "-") + ".ST") : t.replace(/[.\s]/g, "-");
      const nm = root.querySelector("#nm").value.trim() || short(t);
      if (mk === "se" && !(quote(t) || {}).price && root.dataset.confirmed !== t) {
        // Okänd ticker: boten får ingen kurs, och positionen saknas i rapporten. Bekräfta först.
        root.dataset.confirmed = t;
        const tips = tickerTips(t);
        pv.innerHTML = `<div style="color:var(--loss);display:block">Boten har ingen kurs för <b>${esc(t)}</b>. Kontrollera tickern i Avanza – ` +
          `en felstavad ticker gör att innehavet saknar kurs och inte kommer med i rapporten.` +
          (tips.length ? ` Menade du ${tips.map(x => `<b>${esc(short(x))}</b>`).join(" eller ")}?` : "") + `</div>`;
        root.querySelector("#save").textContent = "Spara ändå";
        return;
      }
      const p = { id: "p_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 5), ticker: t, name: nm,
        market: mk, strategy: k, opened: time, buys: [fill], sells: [], stop_override: null, target_override: null,
        plan_stop: stop != null && stop !== "" ? +stop : null, plan_target: target != null && target !== "" ? +target : null,
        signal_id: ev ? ev.id : null, atr: atr ? +atr : (ev && ev.atr) || null,
        sources: source ? String(source).split(",").filter(Boolean) : [],
        idea_source: (ideaFor(t) || {}).source || null };
      await save(d => d.open.push(p), `Köp ${short(t)}`, "Köp registrerat");
    };
  });
}

function sellSheet(posId, price) {
  const p = D.positions.open.find(x => x.id === posId);
  if (!p) return toast("Innehavet finns inte längre.", true);
  const s = stats(p), cur = curOf(p.ticker), q = quote(p.ticker);
  if (!price && q) price = q.price;
  openSheet(`
    <h3>Sälj ${esc(p.name || short(p.ticker))}</h3>
    <p class="lead">Du äger ${fmt(s.qty, 0)} st med GAV ${fmt(s.gav)} ${cur}.</p>
    <form id="f">
      <div class="cols">
        ${field("qty", "Antal sålda", String(s.qty), `${numAttrs} required`, `<button type="button" class="link" id="all">Hela innehavet</button>`)}
        ${field("pr", "Kurs per aktie", price ? String(+(+price).toFixed(4)).replace(".", ",") : "", `${numAttrs} required`)}
      </div>
      <div class="cols">
        ${field("fee", "Courtage", cfg.fee ? String(cfg.fee).replace(".", ",") : "0", numAttrs)}
        ${field("tm", "Tid", localNow(), `type="datetime-local" required`)}
      </div>
      <div class="preview" id="pv"></div>
      <div class="sheet-actions"><button type="button" class="btn" data-close>Avbryt</button><button class="btn primary" id="save">Spara försäljning</button></div>
    </form>`, root => {
    const pv = root.querySelector("#pv");
    root.querySelector("#all").onclick = () => { root.querySelector("#qty").value = s.qty; upd(); };
    const upd = () => {
      const qty = Math.min(num(root.querySelector("#qty").value), s.qty), pr = num(root.querySelector("#pr").value), fee = num(root.querySelector("#fee").value) || 0;
      if (!(qty > 0 && pr > 0)) { pv.innerHTML = "<div><span>Resultat</span><span>–</span></div>"; return; }
      const r = qty * (pr - s.gav) - fee;
      pv.innerHTML = `<div><span>Resultat</span><b class="${cls(r)}">${signed(r, cur, 2)} (${pct(r / (qty * s.gav))})</b></div>
        <div><span>Kvar efter försäljning</span><span>${qty >= s.qty ? "Positionen stängs" : fmt(s.qty - qty, 0) + " st"}</span></div>`;
    };
    root.querySelectorAll("input").forEach(i => i.addEventListener("input", upd)); upd();
    root.querySelector("#f").onsubmit = async e => {
      e.preventDefault();
      const qty = num(root.querySelector("#qty").value), pr = num(root.querySelector("#pr").value);
      const fee = num(root.querySelector("#fee").value) || 0, time = root.querySelector("#tm").value;
      if (!(qty > 0) || !(pr > 0)) return toast("Fyll i antal och kurs.", true);
      if (qty > s.qty + 1e-9) return toast(`Du äger bara ${fmt(s.qty, 0)} st.`, true);
      cfg.fee = fee; saveCfg();
      await save(d => {
        const i = d.open.findIndex(x => x.id === posId);
        if (i < 0) throw new Error("Innehavet finns inte längre.");
        const pos = d.open[i];
        pos.sells.push({ time, qty, price: pr, fee });
        if (stats(pos).qty <= 1e-9) { pos.closed = time; d.open.splice(i, 1); d.closed.push(pos); }
      }, `Sälj ${short(p.ticker)}`, qty >= s.qty ? "Försäljning registrerad, positionen är stängd" : "Försäljning registrerad");
    };
  });
}

let consLoaded = false;
async function ensureConsensus(force = false) {
  if (consLoaded && !force) return;
  const r = await getFile("consensus");
  D.consensus = r.data || structuredClone(DEFAULTS.consensus);
  D.consensus.observations = D.consensus.observations || [];
  shas.consensus = r.sha; consLoaded = true;
}
const newId = p => `${p}_${Date.now().toString(36)}${Math.random().toString(36).slice(2, 6)}`;
const todayLocal = () => localNow().slice(0, 10);
const priceCur = t => marketOf(t) === "se" ? "SEK" : "USD";
const dShort = d => d ? new Date(d.length === 10 ? d + "T12:00:00" : d).toLocaleDateString("sv-SE", { day: "numeric", month: "short", year: "numeric" }) : "–";
const nOr = (x, d = 0) => x == null ? "–" : fmt(x, d);

function obsLine(o, price, t, list) {
  const up = cUpside(o.target_price, o.currency, price, priceCur(t));
  const r = o.ratings || {}, f = o.forecasts || {};
  const stale = cIsStale(o, todayLocal());
  const status = list ? cStatus(o, list) : "active";
  const tags = [stale ? `<span class="tag warn">inaktuell</span>` : "", o.quality === "warning" ? `<span class="tag warn">varning</span>` : "",
    status === "superseded" ? `<span class="tag">rättad</span>` : "", status === "retracted" ? `<span class="tag bad">felregistrerad</span>` : "",
    o.ai_allowed === false ? `<span class="tag">ej AI</span>` : ""].join("");
  const parts = [];
  if (o.target_price != null) parts.push(`Riktkurs ${fmt(o.target_price, o.target_price % 1 ? 2 : 0)} ${esc(o.currency)}` +
    (up.value != null ? ` <span class="${cls(up.value)}">${pct(up.value)}</span>` : ` <span class="meta">(${esc(up.why)})</span>`));
  if (r.buy != null || r.hold != null || r.sell != null) parts.push(`Köp ${nOr(r.buy)} · Behåll ${nOr(r.hold)} · Sälj ${nOr(r.sell)}`);
  if (o.analysts != null) parts.push(`${fmt(o.analysts, 0)} analytiker`);
  const fc = [];
  if (f.revenue_m != null) fc.push(`omsättning ${fmt(f.revenue_m, 0)} M`);
  if (f.eps != null) fc.push(`EPS ${fmt(f.eps, 2)}`);
  if (f.revenue_growth_pct != null) fc.push(`omsättningstillväxt ${fmt(f.revenue_growth_pct, 1)} %`);
  if (f.earnings_growth_pct != null) fc.push(`vinsttillväxt ${fmt(f.earnings_growth_pct, 1)} %`);
  return `<div class="item ${status !== "active" ? "obs-off" : ""}">
    <div class="src-line"><b>${esc((C_SOURCES[o.source] || {}).label || o.source)}${o.provider ? ` (${esc(o.provider)})` : ""}</b>${tags ? `<span>${tags}</span>` : ""}</div>
    <div>${parts.join(" · ") || "–"}</div>
    ${fc.length ? `<div class="meta">Prognos ${esc(f.year)}: ${fc.join(" · ")}</div>` : ""}
    <div class="meta">Gällde ${dShort(o.observed_at)}${o.source_date ? `, källans datum ${dShort(o.source_date)}` : ""} · registrerad ${dShort(o.recorded_at)} · ${esc(cHorizonText(o.horizon))} · manuell</div>
    ${o.comment ? `<div class="meta">${esc(o.comment)}</div>` : ""}
    ${(o.warnings || []).map(w => `<div class="meta" style="color:var(--hot)">${esc(w)}</div>`).join("")}
  </div>`;
}
function yahooLine(t, price) {
  const st = ((D.research && D.research.stocks) || {})[t];
  const c = st && st.fund && st.fund.consensus;
  if (!c || (c.target == null && c.mean == null)) return { html: "", target: null };
  const up = cUpside(c.target, "SEK", price, priceCur(t));
  const parts = [];
  if (c.target != null) parts.push(`Riktkurs ${fmt(c.target, c.target % 1 ? 2 : 0)}` + (up.value != null ? ` <span class="${cls(up.value)}">${pct(up.value)}</span>` : ""));
  if (c.mean != null) parts.push(`snittbetyg ${fmt(c.mean, 1)} (1 = köp, 5 = sälj)`);
  if (c.n) parts.push(`${fmt(c.n, 0)} analytiker`);
  return { target: c.target, html: `<div class="item"><div class="src-line"><b>Yahoo</b><span><span class="tag">automatisk</span></span></div>
    <div>${parts.join(" · ")}</div><div class="meta">Hämtad ${dShort(st.updated)} · valuta antas vara aktiens · ingår i botens nuvarande regler</div></div>` };
}
function stockHtml(t) {
  const q = quote(t), price = q ? q.price : null;
  const list = D.consensus.observations || [];
  const latest = cLatestBySource(list, t);
  const manual = Object.values(latest).sort((a, b) => b.observed_at.localeCompare(a.observed_at));
  const y = yahooLine(t, price);
  const targets = [...manual.filter(o => o.target_price != null && o.currency === priceCur(t)).map(o => o.target_price), ...(y.target != null ? [y.target] : [])];
  const differ = targets.length > 1 && (Math.max(...targets) / Math.min(...targets) - 1) > 0.005;
  const hist = list.filter(o => o.ticker === t).sort((a, b) => b.recorded_at.localeCompare(a.recorded_at));
  const histRows = hist.map(o => o.kind === "retraction"
    ? `<div class="item obs-off"><div class="src-line"><b>Felregistrering markerad</b><span class="meta">${dShort(o.recorded_at)}</span></div><div class="meta">${esc(o.reason)}</div></div>`
    : obsLine(o, price, t, list) + (cStatus(o, list) === "active" ? `<div class="row-actions" style="margin:0 0 8px"><button class="btn" data-act="cons-fix" data-id="${esc(o.id)}">Rätta</button><button class="btn sell" data-act="cons-retract" data-id="${esc(o.id)}">Markera som fel</button></div>` : "")).join("");
  return `<h3>${esc(nameFor(t))} <span class="pos-sub">${esc(short(t))}</span></h3>
    <p class="lead">${price != null ? `Kurs ${fmt(price)} ${curOf(t)}${q.time ? `, ${esc(when(q.time))}` : ""}` : "Kurs saknas – uppsida kan inte räknas."}</p>
    <button class="btn wide" data-act="cons-add" data-t="${esc(t)}" style="margin-bottom:12px">+ Lägg till konsensus</button>
    <section class="cons"><h4>Analytikerkonsensus</h4>
      ${manual.map(o => obsLine(o, price, t, null)).join("")}${y.html}
      ${!manual.length && !y.html ? `<div class="meta">Ingen analytikerkonsensus registrerad.</div>` : ""}
      ${differ ? `<div class="meta" style="color:var(--hot);margin-top:6px">Källorna anger olika riktkurser. De visas separat och slås inte ihop.</div>` : ""}
    </section>
    <section class="cons"><h4>Användarkonsensus – Börsdata</h4>
      <div class="meta">Inte professionell analytikerkonsensus: snittet av Börsdata-användarnas egna estimat.</div>
      <div class="meta" style="margin-top:4px">Inga ögonblicksbilder än. De hämtas nattligt när det steget är godkänt och infört.</div>
    </section>
    <section class="cons"><h4>LaMachinas egen värdering</h4><div class="meta">Ej analyserad</div></section>
    <details ${hist.length ? "" : "hidden"}><summary class="link" style="cursor:pointer">Konsensushistorik (${hist.length} poster)</summary>
      <div class="cons" style="margin-top:8px">${histRows}</div></details>
    <div class="sheet-actions" style="margin-top:12px"><button type="button" class="btn" data-close>Stäng</button></div>`;
}
async function stockSheet(t) {
  openSheet(`<h3>${esc(nameFor(t))}</h3><p class="lead">Läser konsensus…</p>`);
  try { await ensureConsensus(true); } catch (e) {   // alltid färsk: en annan enhet kan ha ändrat
    return openSheet(`<h3>${esc(nameFor(t))}</h3><div class="notice err">${esc(e.message)}</div><div class="sheet-actions"><button class="btn" data-close>Stäng</button></div>`);
  }
  openSheet(stockHtml(t));
  sheet.dataset.ticker = t;
}
function consensusSheet(t, base = null) {
  const v = x => x == null ? "" : String(x).replace(".", ",");
  const b = base || {}, r = b.ratings || {}, f = b.forecasts || {}, h = b.horizon || { type: "12m" };
  let srcSel = b.source || "avanza", confirmed = false;
  openSheet(`
    <h3>${base ? "Rätta" : "Lägg till"} analytikerkonsensus</h3>
    <p class="lead">${esc(nameFor(t))} (${esc(short(t))}). ${base ? "Den gamla observationen sparas och märks som rättad." : "Uppgifter du själv läst av. Lämna tomt det som inte anges av källan."}</p>
    <form id="f" novalidate>
      <div class="field"><label>Källa</label><div class="seg" id="src">
        ${["avanza", "borsdata_sp", "other"].map(k => `<button type="button" data-k="${k}" aria-pressed="${srcSel === k}">${C_SOURCES[k].label}</button>`).join("")}</div></div>
      ${field("prov", "Ursprunglig leverantör (valfritt)", b.provider || "", `autocomplete="off" placeholder="Om källan anger det"`)}
      <div class="cols">
        ${field("obd", "Observationsdatum", b.observed_at || todayLocal(), `type="date" required`)}
        ${field("srd", "Källans datum (valfritt)", b.source_date || "", `type="date"`)}
      </div>
      <div class="cols">
        <div class="field"><label for="hz">Prognoshorisont</label><select id="hz"><option value="12m">12 månader (riktkurs)</option><option value="fiscal_year">Räkenskapsår</option></select></div>
        ${field("hy", "Räkenskapsår", h.year || "", `${numAttrs} placeholder="2027"`)}
      </div>
      <fieldset class="grp"><legend>Analytikerrekommendationer</legend>
        <div class="cols">
          ${field("tp", "Genomsnittlig riktkurs", v(b.target_price), numAttrs)}
          <div class="field"><label for="cur">Valuta</label><select id="cur">${C_CURRENCIES.map(c => `<option>${c}</option>`).join("")}</select></div>
        </div>
        <div class="cols3">
          ${field("rb", "Köp", v(r.buy), `inputmode="numeric" autocomplete="off"`)}
          ${field("rh", "Behåll", v(r.hold), `inputmode="numeric" autocomplete="off"`)}
          ${field("rs", "Sälj", v(r.sell), `inputmode="numeric" autocomplete="off"`)}
        </div>
        ${field("an", "Antal analytiker (om källan anger det)", v(b.analysts), `inputmode="numeric" autocomplete="off"`)}
      </fieldset>
      <details ${Object.values(f).some(x => x != null) ? "open" : ""}><summary class="link" style="cursor:pointer;margin-bottom:10px">Valfria prognoser</summary>
        <div class="cols">${field("rev", "Omsättning (M)", v(f.revenue_m), numAttrs)}${field("eps", "EPS", v(f.eps), numAttrs)}</div>
        <div class="cols">${field("rg", "Omsättningstillväxt (%)", v(f.revenue_growth_pct), numAttrs)}${field("eg", "Vinsttillväxt (%)", v(f.earnings_growth_pct), numAttrs)}</div>
        ${field("fy", "Prognosår", v(f.year), `${numAttrs} placeholder="2027"`)}
      </details>
      <div class="field"><label for="cm">Kommentar (valfritt)</label><textarea id="cm" placeholder="Katalysatorer, risker, viktiga antaganden">${esc(b.comment || "")}</textarea></div>
      <div class="field"><label><input type="checkbox" id="ai" ${b.ai_allowed === false ? "" : "checked"} style="width:auto;height:auto;margin-right:8px">Får användas i LaMachinas privata AI-analys</label></div>
      <div class="msgs err" id="errs" hidden></div><div class="msgs warn" id="warns" hidden></div>
      <div class="sheet-actions"><button type="button" class="btn" data-act="stock" data-t="${esc(t)}">Avbryt</button><button class="btn primary" id="save">Spara konsensus</button></div>
    </form>`, root => {
    root.querySelector("#hz").value = h.type;
    root.querySelector("#cur").value = b.currency || priceCur(t);
    root.querySelectorAll("#src button").forEach(x => x.onclick = () => {
      srcSel = x.dataset.k; root.querySelectorAll("#src button").forEach(y => y.setAttribute("aria-pressed", y === x));
    });
    root.querySelectorAll("input,select,textarea").forEach(i => i.addEventListener("input", () => { confirmed = false; root.querySelector("#save").textContent = "Spara konsensus"; }));
    const val = id => root.querySelector("#" + id).value;
    root.querySelector("#f").onsubmit = async e => {
      e.preventDefault();
      const input = { ticker: t, source: srcSel, provider: val("prov"), observed_at: val("obd"), source_date: val("srd"),
        horizon_type: val("hz"), horizon_year: val("hy"), target_price: val("tp"), currency: val("cur"),
        buy: val("rb"), hold: val("rh"), sell: val("rs"), analysts: val("an"), revenue_m: val("rev"), eps: val("eps"),
        revenue_growth_pct: val("rg"), earnings_growth_pct: val("eg"), forecast_year: val("fy"), comment: val("cm"),
        ai_allowed: root.querySelector("#ai").checked, supersedes: base ? base.id : null };
      const res = cValidate(input, D.consensus.observations, { today: todayLocal(), now: new Date().toISOString(), id: newId("c"), priceCurrency: priceCur(t) });
      const show = (id, items) => { const el = root.querySelector("#" + id); el.hidden = !items.length;
        el.innerHTML = items.length ? `<ul>${items.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : ""; };
      show("errs", res.errors); show("warns", res.warnings);
      if (res.errors.length) return toast("Rätta de markerade uppgifterna.", true);
      if (res.warnings.length && !confirmed) { confirmed = true; root.querySelector("#save").textContent = "Spara ändå"; return; }
      await saveConsensus(t, d => cAppend(d.observations, res.obs), `Konsensus ${short(t)} (${C_SOURCES[srcSel].label})`,
        base ? "Rättelsen är sparad" : "Konsensus sparad");
    };
  });
}
async function saveConsensus(t, fn, message, okText) {
  const btn = sheet.querySelector("#save");
  if (btn) { btn.disabled = true; btn.textContent = "Sparar…"; }
  try {
    await mutateFile("consensus", d => {
      d.schema = 1; d.observations = d.observations || [];
      const before = structuredClone(d.observations);
      fn(d);
      if (!cUnchangedPrefix(before, d.observations)) throw new Error("Avbrutet: befintlig konsensushistorik skulle ha ändrats.");
    }, message);
    consLoaded = true;
    await stockSheet(t); toast(okText);
  } catch (err) {
    toast(err.message, true);
    if (btn) { btn.disabled = false; btn.textContent = "Försök igen"; }
  }
}

function settingsSheet() {
  const has = !!cfg.token;
  openSheet(`
    <h3>Koppla GitHub</h3>
    <p class="lead">Uppgifterna sparas bara i den här webbläsaren och skickas bara till GitHub. Se README för hur du skapar en token.</p>
    <form id="f">
      <div class="cols">
        ${field("ow", "Användarnamn", cfg.owner, `autocapitalize="none" autocomplete="off" required placeholder="jonas"`)}
        ${field("rp", "Repo", cfg.repo, `autocapitalize="none" autocomplete="off" required placeholder="aktiescreener"`)}
      </div>
      ${field("tk", "Token", "", `type="password" autocomplete="off" ${has ? "" : "required"} placeholder="${has ? "Sparad – lämna tomt för att behålla" : "github_pat_…"}"`,
        "Fine-grained token med åtkomst till bara det privata repot, behörigheten Contents: Read and write och ett utgångsdatum (högst 90 dagar).")}
      <div class="field"><label><input type="checkbox" id="rem" ${cfg.remember ? "checked" : ""} style="width:auto;height:auto;margin-right:8px">Kom ihåg token på den här enheten</label>
        <div class="hint">Avbockat: token glöms när fliken stängs och du anger den igen nästa gång.</div></div>
      <div class="sheet-actions"><button type="button" class="btn" data-close>Avbryt</button><button class="btn primary">Spara och anslut</button></div>
      ${has ? `<div class="danger-zone"><button type="button" class="btn sell wide" id="forget">Glöm token på den här enheten</button></div>` : ""}
    </form>`, root => {
    root.querySelector("#f").onsubmit = async e => {
      e.preventDefault();
      cfg.owner = root.querySelector("#ow").value.trim(); cfg.repo = root.querySelector("#rp").value.trim();
      const tk = root.querySelector("#tk").value.trim();
      if (tk) cfg.token = tk;
      cfg.remember = root.querySelector("#rem").checked; saveCfg();
      closeSheet(); await refresh();
      if (!loadError || loadError === "nobranch") toast("Ansluten");
    };
    const f = root.querySelector("#forget");
    if (f) f.onclick = () => { forgetToken(); closeSheet(); D = structuredClone(DEFAULTS); loadError = "setup"; render(); toast("Token borttagen"); };
  });
}

async function save(fn, message, okText, file = "positions") {
  const btn = sheet.querySelector("#save") || sheet.querySelector("button.primary");
  if (btn) { btn.disabled = true; btn.textContent = "Sparar…"; }
  try {
    await mutateFile(file, fn, message);
    closeSheet(); render(); toast(okText);
  } catch (err) {
    toast(err.message, true);
    if (btn) { btn.disabled = false; btn.textContent = "Försök igen"; }
  }
}

/* =====================================================================
   Händelser
   ===================================================================== */
let toastTimer;
function toast(msg, err = false) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.className = "toast show" + (err ? " err" : "");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.className = "toast", err ? 5000 : 2600);
}
document.querySelector("nav.tabs").addEventListener("click", e => {
  const b = e.target.closest("button[data-tab]"); if (!b) return;
  tab = b.dataset.tab; history.replaceState(null, "", `?tab=${tab}${qs.get("api") ? "&api=" + encodeURIComponent(qs.get("api")) : ""}`);
  render(); window.scrollTo(0, 0);
});
document.addEventListener("click", e => {
  if (e.target.closest("[data-close]")) return closeSheet();
  const f = e.target.closest("[data-filter]"); if (f) { histFilter = f.dataset.filter; return render(); }
  const a = e.target.closest("[data-act]"); if (!a) return;
  const { act, id, price } = a.dataset;
  if (act === "settings") return settingsSheet();
  if (cfgMissing()) return settingsSheet();
  if (act === "buy") buySheet();
  if (act === "buymore") buySheet({ posId: id });
  if (act === "sell") sellSheet(id, price ? +price : null);
  if (act === "edit") editSheet(id);
  if (act === "buyevent") { const ev = D.events.find(x => x.id === id);
    buySheet({ ticker: ev.ticker, name: ev.name, price: ev.price, atr: ev.atr, event: ev.id }); }
  if (act === "idea") return ideaSheet();
  if (act === "archive") {
    const it = activeIdeas().find(x => x.id === id);
    if (!it || !confirm(`Arkivera idén ${it.name || short(it.ticker)}? Boten slutar bevaka den.`)) return;
    return save(d => { const x = (d.ideas || []).find(y => y.id === id); if (x) x.status = "archived"; },
      `Arkivera idé ${short(it.ticker)}`, "Idén är arkiverad", "ideas");
  }
  if (act === "addevent") { const ev = D.events.find(x => x.id === id);
    buySheet({ posId: ev.pos_id, price: ev.price, addEvent: ev.id }); }
  if (act === "stock") return stockSheet(a.dataset.t);
  if (act === "cons-add") return (async () => { try { await ensureConsensus(); } catch (err) { return toast(err.message, true); }
    consensusSheet(a.dataset.t); })();
  if (act === "cons-fix") { const o = (D.consensus.observations || []).find(x => x.id === id); if (o) consensusSheet(o.ticker, o); return; }
  if (act === "cons-retract") {
    const o = (D.consensus.observations || []).find(x => x.id === id); if (!o) return;
    const why = prompt("Markera observationen som felregistrerad. Den sparas men används inte. Orsak (valfritt):", "");
    if (why === null) return;
    return saveConsensus(o.ticker, d => cAppend(d.observations, cRetraction(o, { id: newId("r"), now: new Date().toISOString() }, why)),
      `Konsensus ${short(o.ticker)}: felregistrering`, "Markerad som felregistrerad");
  }
});
const cfgMissing = () => !cfg.owner || !cfg.repo || !cfg.token;
document.getElementById("openSettings").onclick = settingsSheet;
document.getElementById("refresh").onclick = () => refresh();

async function refresh() {
  const b = document.getElementById("refresh"); b.classList.add("spin");
  consLoaded = false;
  try { await loadAll(); } catch (e) { loadError = e.message; }
  b.classList.remove("spin"); render();
}
document.addEventListener("visibilitychange", () => { if (!document.hidden && !scrim.classList.contains("open")) refresh(); });

/* Djuplänkar från notiserna: ?buy=…  ?sell=…  ?tab=… */
(async () => {
  render();
  await refresh();
  const deep = qs.get("buy") || qs.get("sell") || qs.get("buymore");
  if (cfgMissing() && deep) return settingsSheet();
  if (qs.get("buy")) buySheet({ ticker: qs.get("buy"), name: qs.get("name") || "", price: qs.get("price") || "",
    atr: qs.get("atr"), event: qs.get("event"), strategy: qs.get("strategy"), stop: qs.get("stop"), source: qs.get("source"),
    target: qs.get("target"), qty: qs.get("qty") });
  else if (qs.get("buymore")) {
    const addEv = (D.events || []).find(x => x.add && x.pos_id === qs.get("buymore") && !(openPositions().find(p => p.id === x.pos_id)?.buys || []).some(b => b.signal_id === x.id));
    buySheet({ posId: qs.get("buymore"), price: qs.get("price") || "", qty: qs.get("qty"), addEvent: addEv ? addEv.id : "deeplink" });
  }
  else if (qs.get("sell")) sellSheet(qs.get("sell"), qs.get("price") ? +qs.get("price") : null);
  if (deep) history.replaceState(null, "", `?tab=${tab}${qs.get("api") ? "&api=" + encodeURIComponent(qs.get("api")) : ""}`);
})();
